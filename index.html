<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="pwsh" />
  <meta name="theme-color" content="#012456" />
  <title>PowerShell 7</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="app">
  <header id="topbar">
    <div class="logo">&gt;_</div>
    <div class="title">PowerShell 7.6</div>
    <div class="meta" id="hostmeta">pwsh-ios</div>
    <button type="button" id="btn-theme" title="Theme">Theme</button>
    <button type="button" id="btn-help" title="Help">Help</button>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div id="promptrow">
    <div id="prompt">PS /Users/Jendry&gt;</div>
    <textarea id="cmdline" rows="1" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="enter"></textarea>
  </div>
  <nav id="keys">
    <div class="row">
      <button data-k="Tab">Tab</button>
      <button data-k="Ctrl" id="btn-ctrl" class="ctrl">Ctrl</button>
      <button data-k="Esc">Esc</button>
      <button data-k="ArrowUp">↑</button>
      <button data-k="ArrowDown">↓</button>
      <button data-k="ArrowLeft">←</button>
      <button data-k="ArrowRight">→</button>
      <button data-k="Enter" class="enter wide">Enter</button>
    </div>
    <div class="row">
      <button data-insert="-">-</button>
      <button data-insert="$">$</button>
      <button data-insert="_">_</button>
      <button data-insert="|">|</button>
      <button data-insert=";">;</button>
      <button data-insert=".">.</button>
      <button data-insert="/">/</button>
      <button data-insert="\\">\</button>
      <button data-insert="'">'</button>
      <button data-insert='"'> "</button>
    </div>
    <div class="row">
      <button data-insert="{">{</button>
      <button data-insert="}">}</button>
      <button data-insert="(">(</button>
      <button data-insert=")">)</button>
      <button data-insert="`">`</button>
      <button data-insert="@">@</button>
      <button data-insert="#">#</button>
      <button data-act="paste">Paste</button>
      <button data-act="cls">cls</button>
    </div>
  </nav>
  <div id="install">
    <b>Install PowerShell on this iPhone</b>
    Tap Share, then <b>Add to Home Screen</b>. Opens full-screen like a native app.
    <div class="row">
      <button type="button" id="install-ok">Got it</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
